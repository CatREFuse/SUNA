 const label=(value,x,y,max)=>{let output=String(value);while(ctx.measureText(output).width>max&&output.length>1)output=output.slice(0,-2)+'…';ctx.fillText(output,x,y)};
 for(const role of roles){const members=accounts.map((a,i)=>a.characterId===role?i:-1).filter(i=>i>=0),y=members.reduce((sum,i)=>sum+ys[i],0)/members.length;for(const i of members){const account=accounts[i];ctx.strokeStyle=color(account);ctx.globalAlpha=connected(account) ? .85 : .35;ctx.lineWidth=account.accountId===selected?2.5:1.5;ctx.setLineDash(connected(account)?[]:[5,5]);ctx.beginPath();ctx.moveTo(left+nodeW,y);ctx.bezierCurveTo(width*.48,y,width*.52,ys[i],right,ys[i]);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;}pill(left,y-25,nodeW,surface);ctx.save();ctx.beginPath();ctx.arc(left+25,y,17,0,Math.PI*2);ctx.clip();const roleImage=roleImages.get(role);if(roleImage?.complete&&roleImage.naturalWidth)ctx.drawImage(roleImage,left+8,y-17,34,34);else{ctx.fillStyle=soft;ctx.fillRect(left+8,y-17,34,34);ctx.fillStyle=fg;ctx.font='14px -apple-system,sans-serif';ctx.fillText(context.characters.find(c=>c.id===role)?.avatar||context.characters.find(c=>c.id===role)?.name?.slice(0,1)||'·',left+18,y)}ctx.restore();ctx.font='14px -apple-system,sans-serif';ctx.fillStyle=fg;label(context.characters.find(c=>c.id===role)?.name??'未分配角色',left+51,y,nodeW-62)}
 accounts.forEach((account,i)=>{const profile=profiles.get(account.accountId);pill(right,ys[i]-25,nodeW,surface);ctx.save();ctx.beginPath();ctx.roundRect(right+9,ys[i]-17,34,34,10);ctx.clip();const img=images.get(account.accountId);if(img?.complete&&img.naturalWidth)ctx.drawImage(img,right+9,ys[i]-17,34,34);else{ctx.fillStyle=color(account);ctx.fillRect(right+9,ys[i]-17,34,34);ctx.fillStyle=surface;ctx.font='16px -apple-system,sans-serif';ctx.fillText('QQ',right+13,ys[i])}ctx.restore();ctx.fillStyle=fg;ctx.font='14px -apple-system,sans-serif';label(profile?.nickname||account.selfId||'QQ 账号',right+52,ys[i]-8,nodeW-65);ctx.font='12px -apple-system,sans-serif';ctx.fillStyle=muted;label('QQ · '+accountStatus(account),right+52,ys[i]+12,nodeW-65);ctx.save();ctx.fillStyle=surface;ctx.beginPath();ctx.arc(right+42,ys[i]+14,9,0,Math.PI*2);ctx.fill();ctx.translate(right+34,ys[i]+6);ctx.scale(16/24,16/24);ctx.fillStyle=color(account);for(const match of QQ_PATHS.matchAll(/d="([^"]+)"/g))ctx.fill(new Path2D(match[1]));ctx.restore();hits.push({id:account.accountId,x:right,y:ys[i]-25,w:nodeW,h:50})});
 canvas.setAttribute('aria-label',accounts.map(a=>`${person(a)?.name??'未分配角色'}连接到 QQ ${profiles.get(a.accountId)?.selfId||a.selfId||'未登录账号'}，${accountStatus(a)}`).join('；'));
}
async function avatar(account){if(avatars.has(account.accountId))return;const identity=profiles.get(account.accountId)?.selfId;try{const result=await request('channels.avatar',{accountId:account.accountId});if(identity!==profiles.get(account.accountId)?.selfId)return;if(!/^data:image\/(png|jpeg|webp);base64,/.test(result.dataUrl))return;avatars.set(account.accountId,result.dataUrl);const image=new Image();images.set(account.accountId,image);image.onload=draw;image.src=result.dataUrl;renderCards()}catch{/* Actual image unavailable: retain the neutral account icon. */}}
const accountBinding=account=>JSON.stringify([account.characterId,account.config.transport,account.config.webuiUrl,account.config.expectedSelfId]);
async function checkAccount(account,refresh=false){
 const key=account.accountId,binding=accountBinding(account),revision=(profileRequests.get(key)??0)+1;profileRequests.set(key,revision);
 const fresh=()=>profileRequests.get(key)===revision&&context.accounts.some(latest=>latest.accountId===key&&accountBinding(latest)===binding);
 try{const result=await request(refresh?'channels.qr':'channels.poll',{accountId:key});if(!fresh())return;const previous=profiles.get(key);if(previous?.selfId!==result.selfId){avatars.delete(key);images.delete(key)}profiles.set(key,result);if(result.selfId||account.selfId)void avatar(account)}catch(error){if(fresh())profiles.set(key,{error:error.message})}
}
async function load(){const revision=contextRevision,next=await request('context');if(revision!==contextRevision)return;context=next;if(selected&&!context.accounts.some(a=>a.accountId===selected)){$('details').close();selected=''}for(const id of new Set(context.accounts.map(a=>a.characterId))){const role=context.characters.find(c=>c.id===id);if(role)void roleAvatar(role)}renderCards();if($('details').open)renderDetail();draw();renderCreateStatus();}
async function refreshAll(){if(refreshing)return;refreshing=true;try{await load();for(let i=0;i<context.accounts.length;i+=4)await Promise.all(context.accounts.slice(i,i+4).map(a=>checkAccount(a)));renderCards();renderDetail();draw()}finally{refreshing=false}}
async function check(refresh){const account=current();if(!account)return;await checkAccount(account,refresh);renderCards();renderDetail();draw()}
$('refresh').onclick=()=>action(refreshAll);$('configure').onclick=()=>action(async()=>{const key=selected;closeDetail();await suna.configure(key)});$('connect').onclick=()=>action(async()=>{await request(['connected','waiting-webhook'].includes(current().status)?'channels.disconnect':'channels.connect',{accountId:selected});await refreshAll()});$('remove').onclick=()=>{$('delete-confirm').style.display='block'};$('delete-cancel').onclick=()=>{$('delete-confirm').style.display='none'};$('delete-yes').onclick=()=>action(async()=>{await request('channels.remove',{accountId:selected});closeDetail();await refreshAll()});$('check-login').onclick=()=>action(()=>check(false));$('refresh-qr').onclick=()=>action(()=>check(true));
$('topology').onclick=event=>{const rect=$('topology').getBoundingClientRect(),hit=hits.find(h=>event.clientX-rect.left>=h.x&&event.clientX-rect.left<=h.x+h.w&&event.clientY-rect.top>=h.y&&event.clientY-rect.top<=h.y+h.h);if(hit)select(hit.id)};
$('topology').onkeydown=event=>{if(!['ArrowLeft','ArrowRight','ArrowDown','ArrowUp'].includes(event.key)||!context?.accounts.length)return;event.preventDefault();const ids=context.accounts.map(a=>a.accountId),index=ids.indexOf(selected);select(ids[(index+(['ArrowRight','ArrowDown'].includes(event.key)?1:ids.length-1))%ids.length])};
new ResizeObserver(draw).observe($('topology').parentElement);new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['style']});

async function roleAvatar(role){if(roleAvatars.has(role.id)||pendingAvatars.has(role.id))return;pendingAvatars.add(role.id);try{const result=role.avatarDataUrl?{dataUrl:role.avatarDataUrl}:await request('characters.avatar',{characterId:role.id});if(!/^data:image\/(png|jpeg|webp|gif);base64,/.test(result.dataUrl))return;roleAvatars.set(role.id,result.dataUrl);const img=new Image();img.onload=draw;roleImages.set(role.id,img);img.src=result.dataUrl;renderCards();if($('details').open)renderDetail()}catch{}finally{pendingAvatars.delete(role.id)}}
function managedStatus(){return context?.managedNapcat??{available:false,reason:'独立 NapCat 运行环境未就绪'}}
const managedReasons={RUNTIME_MISSING:'未安装独立 NapCat 运行环境',PLATFORM_UNSUPPORTED:'当前系统不支持独立 NapCat',RUNTIME_INVALID:'独立 NapCat 运行环境无效',NAPCAT_RUNTIME_UNAVAILABLE:'独立 NapCat 运行环境不可用',NAPCAT_PLATFORM_UNSUPPORTED:'当前系统不支持独立 NapCat',NATIVE_REQUIRED:'请在桌面应用中新增 QQ 账号'};
function renderCreateStatus(){const status=managedStatus();text('create-state',status.available&&status.canCreate===true?'':managedReasons[status.reason]||'当前无法启动独立 NapCat');$('start-account').disabled=busy||!status.available||status.canCreate!==true||!createCharacterId}
function closeCreate(){sequence++;$('create-dialog').close();returnFocus?.isConnected&&returnFocus.focus()}
function openCreate(){if(busy)return;returnFocus=document.activeElement;createRequestId=crypto.randomUUID();createCharacterId=current()?.characterId||context?.characters[0]?.id||'';text('create-error','');$('create-character').replaceChildren(ui.select({value:createCharacterId,label:'绑定角色',options:(context?.characters??[]).map(role=>({value:role.id,label:role.name})),onChange:value=>{createCharacterId=value;createRequestId=crypto.randomUUID();renderCreateStatus()}}));renderCreateStatus();$('create-dialog').showModal()}
$('start-account').onclick=()=>action(async()=>{text('create-error','');text('create-state','正在启动 NapCat…');const revision=sequence;try{const account=await request('channels.managed.create',{characterId:createCharacterId,requestId:createRequestId});await load();if(sequence!==revision||!$('create-dialog').open)return;$('create-dialog').close();select(account.accountId,true);returnFocus=$('add-account');await check(false)}catch(error){text('create-error',error.message);renderCreateStatus()}});
const closePath='<path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>';
$('close-detail').append(icon(closePath));$('close-create').append(icon(closePath));$('close-detail').onclick=closeDetail;$('close-create').onclick=closeCreate;$('add-account').onclick=openCreate;
$('details').addEventListener('cancel',event=>{event.preventDefault();closeDetail()});$('create-dialog').addEventListener('cancel',event=>{event.preventDefault();closeCreate()});
for(const dialog of [$('details'),$('create-dialog')])dialog.addEventListener('click',event=>{if(event.target!==dialog)return;const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)(dialog===$('details')?closeDetail:closeCreate)()});

void action(refreshAll);setInterval(()=>{if(!document.hidden&&!busy&&!refreshing)void refreshAll().catch(error=>text('error',error.message))},10000);
})();
</script></body></html>
